# baseline evaluators:
evaluators=simple
evaluators=random
# planners:
planners=softmax
p1-max-search-depth=1

# neural network evaluators:
evaluators=tnetwork16
e1-net-model-path=networks/net16-mc.model
e1-net-architecture=32
e1-net-random-weights=true

# Training configuration
state-evaluator=montecarlo
se-max-rollouts=100
se-max-plies=10
training-monte-carlo=true

ranker-verbosity=2
verbosity=2
num-threads=32
training-epochs=5
max-generations=5
save-on-completion=1
